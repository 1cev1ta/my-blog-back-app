plugins {
    id 'java'
    id 'war'
}

group = 'ru.yandex.practicum'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    springVersion = '6.2.19'
    springDataJdbcVersion = '3.5.13'
    jacksonVersion = '2.21.8'
    junitVersion = '5.14.4'
    hikariVersion = '6.3.3'
    postgresqlVersion = '42.7.14'
    h2Version = '2.3.232'
    logbackVersion = '1.5.18'
    servletApiVersion = '6.0.0'
    jsonPathVersion = '2.9.0'
}

dependencies {
    implementation platform("org.springframework:spring-framework-bom:${springVersion}")

    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-beans'
    implementation 'org.springframework:spring-core'
    implementation 'org.springframework:spring-web'
    implementation 'org.springframework:spring-webmvc'
    implementation 'org.springframework:spring-jdbc'
    implementation 'org.springframework:spring-tx'
    implementation "org.springframework.data:spring-data-jdbc:${springDataJdbcVersion}"

    implementation platform("com.fasterxml.jackson:jackson-bom:${jacksonVersion}")
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation "com.zaxxer:HikariCP:${hikariVersion}"

    implementation "ch.qos.logback:logback-classic:${logbackVersion}"

    runtimeOnly "org.postgresql:postgresql:${postgresqlVersion}"

    compileOnly "jakarta.servlet:jakarta.servlet-api:${servletApiVersion}"

    testImplementation "jakarta.servlet:jakarta.servlet-api:${servletApiVersion}"
    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testImplementation "com.jayway.jsonpath:json-path:${jsonPathVersion}"
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly "com.h2database:h2:${h2Version}"
}

war {
    archiveFileName = 'my-blog-back-app.war'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters']
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        showStandardStreams = false
    }
}
