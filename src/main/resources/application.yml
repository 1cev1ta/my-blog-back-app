spring:
  application:
    name: my-blog-back-app
  datasource:
    url: ${BLOG_DB_URL:jdbc:postgresql://localhost:5432/blog}
    username: ${BLOG_DB_USERNAME:blog}
    password: ${BLOG_DB_PASSWORD:blog}
    driver-class-name: ${BLOG_DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 10000
  sql:
    init:
      mode: always
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
